# M2.5：Polymarket 只读普查与 PIT Market Index 的构建参数。
# 来源仓库一律只读；negRisk 回补与续爬属 acquisition 流程，需人类单独授权。

source:
  roots:
    hf: /Users/xinyu/Code/AR-Polymarket/AlternativeAR/Alpha-Data/data/polymarket/daily_aligned
    ext: /Users/xinyu/Code/AR-Polymarket/AlternativeAR/Alpha-Data/data/polymarket/features/extension_tape

output:
  data_dir: data/pm_index
  manifest_dir: artifacts/manifests

build:
  workers: 8

index:
  # block_timestamp 按 M1 合同已是撮合时刻的保守下界；延迟为 0 时仍不构成前视。
  # 该值一经冻结即进入产物指纹，改动会使全部下游产物失效。
  availability_delay_seconds: 0
  # 滚动流动性窗口。它只用于普查报告，不构成任何全局成员资格判定。
  lookback_days: 7

audit:
  sample_partitions: 24
  asset_map: /Users/xinyu/Code/AR-Polymarket/AlternativeAR/Alpha-Data/data/polymarket_chain/asset_map.parquet
  # markets_clob 在 M2.5 **不被消费**：字段的历史可得性未经证明，留给 Decision Map #12。
  # 这里只记录路径，用于在 manifest 的 deferred_sources 中留痕，不进 inputs。
  markets_clob: /Users/xinyu/Code/AR-Polymarket/AlternativeAR/Alpha-Data/data/polymarket_chain/markets_clob.parquet
  # 从来源独立重跑并比对指纹的分区数
  determinism_sample: 12
  # #12 取证阶段：每段抽多少分区做文本元数据审计
  metadata_sample_partitions: 40

inputs:
  polymarket_manifest: artifacts/manifests/polymarket_tape.json

sc:
  target_parquet: data/spine/sc/target_sc_rv_next_session.parquet

text:
  # 归纳期切点：只用首笔成交早于该日的市场归纳模板，期外市场只用于测量覆盖率。
  # 每个切点对应一个可冻结的映射版本；Study 必须选择归纳期早于其 discovery 窗口的版本。
  induction_cutoffs:
    - "2024-01-01"
    - "2025-01-01"
    - "2025-07-01"
    - "2026-01-01"
  min_markets_per_template: 3

families:
  # 候选机制族的冻结参数。族没有名字，只有 id、成员 token 与规模。
  # 本组参数即 pm_pipeline_variants.py 中标为 adopted 的变体；被弃变体全部
  # 计入 proposal denominator（决定 0004 连带约束 2）。
  #
  # 归纳期开到全史是一个**有代价的选择**：商品机制在 Polymarket 上是 2026 现象，
  # 早切点下 hormuz/oil/wti 相关族根本不存在。代价由决定 0004 承担 ——
  # taxonomy_freeze_at 进入前向门，且归纳语料与裁决区间重叠时 verdict 封顶为 candidate。
  induction_cutoff: "2026-08-01"
  max_tokens: 8000
  min_cooccurrence: 5
  min_pmi: 3.0
  # 互为 top-k 近邻才建边：单靠 PMI 阈值会渗流，95% 的 token 会挤进一个巨型分量
  mutual_knn: 3
  # 连通分量在近似树上会并成巨型分量（平均度仅 2.28），改用带权模块度
  clustering: modularity
  resolution: 1.0
  # 规模预检下限。低于它的族照样登记进 proposal denominator，只是标为被挡下
  min_markets: 50

family_id: FED_DECISION
name_cn: 美联储议息会议的幅度档位
driver_channel: 政策-货币
mechanism_cn: 会议给出加息档意味着鹰派、降息档意味着鸽派。族概率的取值为「加息档发生」。不变档（0 bps / no change）的 Yes 既非加息也非降息，显式排除。
match_field: slug_base
scope: ^(will-the-fed-(increase|raise|decrease|cut|lower)-interest-rates-by-\d+-bps-after-(its|the)-.*meeting|will-there-be-no-change-in-fed-interest-rates-after-.*meeting|will-the-fed-cut-rates-by-\d+-basis-points-in-)
themes:
- fed_policy
seed_family: FED_DECISION
seed_pack: revplm-2026-08
expected_discovery_markets: 20
stages:
- kind: exclude
  name: noise
  pattern: (-say-|-says-|-said-|earnings-mentions-|purple-tie|headlines|nyt-front-page|debt-ceiling|boj-|bank-of-england|bank-of-canada|bank-of-japan|ecb-|european-central-bank|peoples-bank-of-china|turkish-central-bank|brazil|canada|starmer|fed-derivative|-odds-\d|favored-on-|flips-|flip-by-|chair|governor|nominee|nomination|confirm|dissent|abolish|audit|out-as-|out-from-|depart|fire-|vote-at-|podcast|south-park|4chan|steve-jobs|black-jobs|fake-jobs|labor-day|secretary-of-labor|joe-rogan|itf-|bls-|next-bls|credit-card|end-qt|nothing-ever-happens|aliens|supreme-leader|ceasefire|operation|be-in-the-headlines|be-said|anyone-say|-mentions-)
  reason: noise
- kind: exclude
  name: neutral_bracket
  pattern: -(increase|raise)-interest-rates-by-0-bps-|no-change-in-fed-interest-rates
  reason: neutral_bracket
- kind: member
  name: hike_bracket
  pattern: -(increase|raise)-interest-rates-by-\d+-bps-
  sign: 1
- kind: member
  name: cut_bracket
  pattern: -(decrease|cut|lower)-interest-rates-by-\d+-bps-|cut-rates-by-\d+-basis-points
  sign: -1
notes: 不变档 9 个 discovery 市场被显式排除（reason=neutral_bracket），因此锚点是 14+6=20 而不是 29。
